[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-builder"
version = "0.1.0"
description = "Multi-agent code generation and orchestration system built with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-groq>=0.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents*",
    "graph*",
    "models*",
    "tools*"
]

[project.scripts]
multi-agent-builder = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"